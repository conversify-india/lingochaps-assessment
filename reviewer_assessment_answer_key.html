<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewer Assessment Answer Key — Internal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: Inter, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 40px 20px; }
        .card { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 2.5rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .badge { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #64748b; margin-bottom: 2rem; line-height: 1.6; }
        .btn { background: #4f46e5; color: #fff; border: none; padding: 0.9rem 2rem; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #6366f1; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Internal Use Only</div>
        <h1>Reviewer Certification — Answer Key</h1>
        <p>Download the complete reference document with all 11 questions across 8 phases, correct answers, and explanations. Do not share this link with testers.</p>
        <button class="btn" onclick="downloadReferenceDoc()">Download Answer Key (.doc)</button>
    </div>
    <script>
        function downloadReferenceDoc() {
            const content = `
<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word"
      xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #1e293b; margin: 40px; line-height: 1.6; }
  h1 { font-size: 18pt; color: #4f46e5; text-align: center; margin-bottom: 4px; }
  h2 { font-size: 13pt; color: #4f46e5; margin-top: 24px; margin-bottom: 6px; border-bottom: 1px solid #4f46e5; padding-bottom: 4px; }
  .subtitle { text-align: center; color: #64748b; font-size: 10pt; margin-bottom: 24px; }
  .divider { border: none; border-top: 1px solid #e2e8f0; margin: 16px 0; }
  .question { font-weight: bold; margin-top: 12px; margin-bottom: 6px; }
  .option { margin-left: 20px; margin-bottom: 3px; }
  .option.correct { color: #166534; font-weight: bold; }
  .option.incorrect { color: #991b1b; }
  .answer-label { font-size: 9pt; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-top: 8px; }
  .answer { color: #166534; font-weight: bold; margin-bottom: 4px; }
  .explanation-label { font-size: 9pt; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-top: 6px; }
  .explanation { color: #1e293b; background: #f8fafc; border-left: 3px solid #4f46e5; padding: 6px 10px; margin: 4px 0 12px 0; font-size: 10.5pt; }
  .footer { text-align: center; font-size: 9pt; color: #94a3b8; margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
</style>
</head>
<body>
<h1>Lingo Chaps — Reviewer Certification Assessment</h1>
<p class="subtitle">Question &amp; Answer Reference Guide • All Phases</p>
<hr class="divider">
<h2>Phase 1: Intake &amp; Global Communications</h2>
<p><em>Scenario:</em> "Hi, Can you pick up a task? Spanish, 00:00:00-00:15:00, ETA-8pm? Can you confirm?"</p>
<p class="question">Q1. Choose the best next action:</p>
<p class="option incorrect">A. Wait for the assigned translator to confirm availability before replying to the client.</p>
<p class="option incorrect">B. Reply immediately: "Received! We will confirm the ETA in 5-10 minutes."</p>
<p class="option correct">C. Confirm immediately / check resource availability (timezone difference).</p>
<p class="answer-label">Correct Answer:</p><p class="answer">C</p>
<p class="explanation-label">Explanation:</p>
<p class="explanation">Confirming immediately or checking availability with timezone awareness keeps client communication prompt and accurate. Waiting violates the 5-Minute rule.</p>
<hr class="divider">
<h2>Phase 1B: Client C2 Intake Protocol</h2>
<p class="question">Q2. Foreign language detected with tight ETA — correct action?</p>
<p class="option incorrect">A. Accept immediately without mentioning foreign language.</p>
<p class="option correct">B. Check ETA feasibility; request extension if needed.</p>
<p class="option incorrect">C. Reject immediately.</p>
<p class="answer-label">Correct Answer:</p><p class="answer">B</p>
<p class="explanation-label">Explanation:</p>
<p class="explanation">Check ETA feasibility against the foreign language and request a time limit extension if needed.</p>
<hr class="divider">
<h2>Phase 2: Allocation Sheet</h2>
<p class="question">Q3. Which row is correctly formatted?</p>
<p class="option correct">A. Row 1 (Spanish) — complete logs, correct naming Spanish_00:00:00-00:05:00.docx</p>
<p class="option incorrect">B. Row 2 (Persian review) — missing fields, invalid link, no .docx</p>
<p class="option incorrect">C. Row 3 (Bahasa) — dot separators, spaces, missing duration</p>
<p class="answer-label">Correct Answer:</p><p class="answer">A — Row 1 (Spanish)</p>
<hr class="divider">
<h2>Phase 3: Work in Progress</h2>
<p class="question">Q4. What is required while work is in progress?</p>
<p class="option correct">A. Track progress, add metadata, OST screenshots, and comments for incomplete work.</p>
<p class="option incorrect">B. Only check final submission.</p>
<p class="option incorrect">C. Email hourly without logging.</p>
<p class="option incorrect">D. Wait until deadline.</p>
<p class="answer-label">Correct Answer:</p><p class="answer">A</p>
<hr class="divider">
<h2>Phase 4: Issue Resolution</h2>
<p class="question">Q5. Translator missing portions of speech?</p>
<p class="option correct">A. Comment on missing portion and inform senior.</p>
<p class="option incorrect">B. Fix silently yourself.</p>
<p class="option incorrect">C. Ignore it.</p>
<p class="option incorrect">D. Comment without informing senior.</p>
<p class="answer-label">Correct Answer:</p><p class="answer">A</p>
<hr class="divider">
<h2>Phase 5: Timezone Alignment</h2>
<p class="question">Q6. Translator offline in different timezone, 3-hour deadline?</p>
<p class="option incorrect">A. Decline without notifying anyone.</p>
<p class="option incorrect">B. Accept and hope translator responds.</p>
<p class="option correct">C. Consult senior manager; negotiate realistic ETA with client.</p>
<p class="option incorrect">D. Use machine translation.</p>
<p class="answer-label">Correct Answer:</p><p class="answer">C</p>
<hr class="divider">
<h2>Phase 6: Resource Sourcing</h2>
<p class="question">Q7. When to assess timezone and resource availability?</p>
<p class="option incorrect">A. Only after client follow-up.</p>
<p class="option correct">B. Before accepting the task.</p>
<p class="option incorrect">C. After deadline passes.</p>
<p class="option incorrect">D. Assume same timezone as PM.</p>
<p class="answer-label">Correct Answer:</p><p class="answer">B</p>
<hr class="divider">
<h2>Phase 7: Client Approaches</h2>
<p class="question">Q8. Which client requires NO translator details shared?</p>
<p class="answer">A — Client C1</p>
<p class="question">Q9. Timestamp format for Client C1?</p>
<p class="answer">B — hh:mm:ss, 00h:00m:00s strictly</p>
<p class="question">Q10. Origin Text + Language + Context annotations for which client?</p>
<p class="answer">A — Client C1</p>
<p class="question">Q11. Final handover for Client C2?</p>
<p class="answer">A — Via Email attachment</p>
<p class="footer">&copy; 2026 Lingo Chaps — Internal use only.</p>
</body>
</html>`;
            const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'LingoChaps_Reviewer_Assessment_Answer_Key.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
